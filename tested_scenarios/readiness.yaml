apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-app
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readiness-app
  template:
    metadata:
      labels:
        app: readiness-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        readinessProbe:
          httpGet:
            path: /this-path-does-not-exist
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3