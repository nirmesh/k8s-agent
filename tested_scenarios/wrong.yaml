apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: sre-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: sre-lab
spec:
  selector:
    app: WRONG
  ports:
  - port: 80
    targetPort: 80