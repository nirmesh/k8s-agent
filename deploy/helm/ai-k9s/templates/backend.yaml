{{- if .Values.features.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-k9s.fullname" . }}-backend
  labels:
    {{- include "ai-k9s.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app.kubernetes.io/component: backend
    {{- include "ai-k9s.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-k9s.fullname" . }}-backend
  labels:
    {{- include "ai-k9s.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      {{- include "ai-k9s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        {{- include "ai-k9s.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ai-k9s.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: build-kubeconfig
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat > /work/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: in-cluster
                  cluster:
                    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    server: https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT_HTTPS
              contexts:
                - name: in-cluster
                  context:
                    cluster: in-cluster
                    namespace: {{ .Release.Namespace }}
                    user: ai-k9s
              current-context: in-cluster
              users:
                - name: ai-k9s
                  user:
                    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              EOF
              chmod 600 /work/kubeconfig
          volumeMounts:
            - name: kubeconfig
              mountPath: /work
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGODB_URL
              value: {{ if .Values.features.mongodb.enabled }}"mongodb://{{ include "ai-k9s.fullname" . }}-mongodb:27017"{{ else }}{{ required "backend.env.mongodbUrl is required when mongodb is disabled" .Values.backend.env.mongodbUrl | quote }}{{ end }}
            - name: MONGODB_DATABASE
              value: "ai_kubernetes_agent"
            - name: OLLAMA_HOST
              value: {{ .Values.backend.env.ollamaHost | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.backend.env.ollamaModel | quote }}
            - name: OLLAMA_JSON_FORMAT
              value: {{ .Values.backend.env.ollamaJsonFormat | quote }}
            - name: KUBECONFIG
              value: /work/kubeconfig
            - name: KUBECONFIG_PATH
              value: /work/kubeconfig
            - name: LANGSMITH_TRACING
              value: {{ .Values.backend.env.langsmithTracing | quote }}
            - name: LANGSMITH_API_KEY
              value: {{ .Values.backend.env.langsmithApiKey | quote }}
            - name: LANGSMITH_PROJECT
              value: {{ .Values.backend.env.langsmithProject | quote }}
            - name: LANGSMITH_ENDPOINT
              value: {{ .Values.backend.env.langsmithEndpoint | quote }}
            - name: DEBUG_LLM_PROMPT
              value: {{ .Values.backend.env.debugLlmPrompt | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: kubeconfig
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
